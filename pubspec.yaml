name: flutterflow_home_widget
description: >-
  Generates iOS (WidgetKit) and Android (app widget) home screen widgets for a
  Flutter app from one spec: the native widget code, the Flutter plugin the
  app updates them with, and the Xcode project changes.
version: 0.1.1
repository: https://github.com/FlutterFlow/flutterflow_home_widget
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

executables:
  flutterflow_home_widget:
